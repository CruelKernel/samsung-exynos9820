name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses-dev \
        libssl-dev lzop pngcrush schedtool xsltproc zip libxml2-utils git-core zlib1g-dev \
        liblz4-tool lib32z1-dev lib32ncurses6 lib32bz2-dev lib32stdc++6 python-is-python3

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Export variables
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST=github
        export KBUILD_BUILD_USER=action
        export CROSS_COMPILE=$(pwd)/clang/bin/aarch64-linux-gnu-
        export PATH=$(pwd)/clang/bin:$PATH

    - name: Start build
      run: |
        chmod +x cruelbuild
        ./cruelbuild mkimg name="GH-Build" model=G973F toolchain=proton +magisk +ttl +cifs +nohardening

    - name: Upload boot.img
      uses: actions/upload-artifact@v3
      with:
        name: boot-image
        path: ./out/AnyKernel3/boot.img
