name: Build Kernel

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [G973F]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y bc build-essential curl git flex bison zip python3

      - name: Build Kernel
        run: |
          set -x
          chmod +x ./build.sh
          ./build.sh \
            model=G973F \
            name="Cruel-S10-Magisk" \
            +magisk=25.2 \
            +wireguard \
            +nohardening \
            +ttl \
            +io_bfq \
            +sched_performance \
            os_patch_level=2099-12 \
          2>&1 | tee build.log

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot.img
          path: out/boot.img

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: build.log
