name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [G973F]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up environment
        run: sudo apt-get update && sudo apt-get install -y bc curl git zip

      - name: Clone CruelBuild
        run: |
          git clone https://github.com/CruelKernel/cruelbuild cruelbuild
          cd cruelbuild
          ./setup.sh

      - name: Configure Kernel
        run: |
          cd cruelbuild
          ./cruelbuild config \
            model=G973F \
            name="Cruel-S10-Magisk" \
            +magisk=stable \
            +wireguard \
            +io_bfq \
            +sched_performance \
            os_patch_level=2099-12

      - name: Build Kernel
        run: |
          cd cruelbuild
          ./cruelbuild build

      - name: Upload Artifact
        uses: actions/upload-artifact@v2
        with:
          name: boot.img
          path: cruelbuild/out/boot.img
